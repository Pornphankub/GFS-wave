name: GFS-Wave Monthly Pipeline

# รันอัตโนมัติทุกวัน เวลา 02:00 UTC (ปรับเวลาได้ตามสะดวก)
# และสามารถกดรันเองได้จากแท็บ Actions บน GitHub (workflow_dispatch)
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # ให้ workflow commit progress.json กลับเข้า repo ได้

jobs:
  download-one-month:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # กันไว้ไม่ให้เกิน 6 ชม. ของ GitHub Actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (eccodes สำหรับอ่าน GRIB2)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: หาเดือนที่ต้องโหลดถัดไป
        id: next
        run: |
          RESULT=$(python scripts/next_month.py)
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

      - name: ดาวน์โหลดข้อมูลของเดือนนั้น
        if: steps.next.outputs.result != 'FINISHED'
        run: |
          read -r YEAR MONTH <<< "${{ steps.next.outputs.result }}"
          python scripts/download_gfswave.py --year "$YEAR" --month "$MONTH"

      - name: ตั้งค่า Kaggle API Token (รูปแบบใหม่ KGAT_...)
        if: steps.next.outputs.result != 'FINISHED'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p ~/.kaggle
          echo "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token

      - name: อัปโหลดขึ้น Kaggle
        if: steps.next.outputs.result != 'FINISHED'
        run: python scripts/upload_kaggle.py

      - name: ลบไฟล์ข้อมูลออกจาก runner (ไม่ต้อง commit ไฟล์ข้อมูลเข้า repo)
        if: steps.next.outputs.result != 'FINISHED'
        run: rm -rf data_output/*

      - name: Commit progress.json กลับเข้า repo
        if: steps.next.outputs.result != 'FINISHED'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add progress.json
          git commit -m "update progress: ${{ steps.next.outputs.result }}" || echo "ไม่มีอะไรเปลี่ยน"
          git push

      - name: แจ้งเตือนเมื่อโหลดครบทุกเดือนแล้ว
        if: steps.next.outputs.result == 'FINISHED'
        run: echo "โหลดข้อมูลครบทุกเดือนตามที่ตั้งไว้ใน config.py แล้ว ปิด workflow นี้ได้เลย"
